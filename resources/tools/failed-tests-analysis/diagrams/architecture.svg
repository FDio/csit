<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Failed test parameter analysis architecture</title>
  <desc id="desc">Architecture diagram showing data.csv, remote log archives, local cache, analyzer stages, stdout progress, and Excel workbook output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.2; rx: 14; }
      .source { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2.2; rx: 14; }
      .cache { fill: #fef3c7; stroke: #b45309; stroke-width: 2.2; rx: 14; }
      .output { fill: #dcfce7; stroke: #15803d; stroke-width: 2.2; rx: 14; }
      .progress { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.2; rx: 14; }
      .boundary { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.2; stroke-dasharray: 10 7; rx: 22; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="50" y="62">Failed Test Parameter Pattern Analysis</text>
  <text class="text" x="50" y="92">System boundary, data sources, analysis stages, generated workbook, and progress output.</text>

  <rect class="source" x="70" y="185" width="260" height="150"/>
  <text class="label" x="105" y="225">data.csv</text>
  <text class="text" x="105" y="258">Run metadata</text>
  <text class="text" x="105" y="282">Log URLs</text>
  <text class="text" x="105" y="306">Failed test names</text>

  <rect class="source" x="70" y="530" width="260" height="145"/>
  <text class="label" x="105" y="570">Remote log dirs</text>
  <text class="text" x="105" y="604">One per finished run</text>
  <text class="text" x="105" y="628">generated_tests.tar.gz</text>

  <rect class="boundary" x="430" y="145" width="750" height="610"/>
  <text class="label" x="465" y="185">analyze_failed_tests.py</text>
  <text class="small" x="465" y="208">Local batch analyzer. Source inputs are read-only.</text>

  <rect class="box" x="480" y="260" width="190" height="92"/>
  <text class="label" x="515" y="295">CSV reader</text>
  <text class="small" x="515" y="322">read_input_csv</text>

  <rect class="cache" x="790" y="260" width="245" height="92"/>
  <text class="label" x="825" y="295">Archive cache</text>
  <text class="small" x="825" y="322">.cache/failed-test-logs</text>

  <rect class="box" x="480" y="455" width="205" height="110"/>
  <text class="label" x="515" y="490">Robot parser</text>
  <text class="small" x="515" y="517">NIC, driver, framesize</text>
  <text class="small" x="515" y="538">cores, test area</text>

  <rect class="box" x="755" y="455" width="190" height="110"/>
  <text class="label" x="790" y="490">Grouping</text>
  <text class="small" x="790" y="517">iterative tuple</text>
  <text class="small" x="790" y="538">coverage per row</text>

  <rect class="box" x="1000" y="455" width="140" height="110"/>
  <text class="label" x="1030" y="490">Mining</text>
  <text class="small" x="1030" y="517">rate, share</text>
  <text class="small" x="1030" y="538">lift, rank</text>

  <rect class="output" x="1300" y="250" width="235" height="150"/>
  <text class="label" x="1335" y="290">Excel output</text>
  <text class="text" x="1335" y="324">Findings</text>
  <text class="text" x="1335" y="348">Group Summary</text>
  <text class="text" x="1335" y="372">Skipped Runs</text>

  <rect class="progress" x="1300" y="540" width="235" height="120"/>
  <text class="label" x="1335" y="580">stdout</text>
  <text class="text" x="1335" y="613">Progress counters</text>
  <text class="text" x="1335" y="637">Final totals</text>

  <path class="arrow" d="M330 260 H480"/>
  <text class="small" x="360" y="246">CSV rows</text>

  <path class="arrow" d="M330 603 H450 V510 H480"/>
  <text class="small" x="350" y="587">archives</text>

  <path class="arrow" d="M670 306 H790"/>
  <text class="small" x="700" y="292">log URLs</text>

  <path class="arrow" d="M913 352 V420 H582 V455"/>
  <text class="small" x="695" y="406">cached archive</text>

  <path class="arrow" d="M685 510 H755"/>
  <path class="arrow" d="M945 510 H1000"/>
  <path class="arrow" d="M1140 510 H1215 V325 H1300"/>
  <path class="muted" d="M1140 540 H1225 V600 H1300"/>
</svg>
