<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">CSIT MCP code architecture</title><desc id="desc">Client connection, rendering, exports, MCP transport, server assembly, cache, generic services, semantic services, and source data modules.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#455A64"/></marker><style>.t{font:700 26px Arial;fill:#172B4D}.h{font:700 16px Arial;fill:#172B4D}.b{font:15px Arial;fill:#263238}.x{stroke-width:2}.e{fill:none;stroke:#455A64;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="950" fill="#fff"/><text class="t" x="40" y="48">CSIT MCP Code Architecture</text>
  <g><rect class="x" x="40" y="100" width="240" height="120" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="160" y="135" text-anchor="middle">Browser</text><text class="b" x="160" y="168" text-anchor="middle">GET / + query state</text><text class="b" x="160" y="196" text-anchor="middle">dialogs · exports · sharing</text></g>
  <g><rect class="x" x="40" y="300" width="240" height="100" rx="7" fill="#F3E5F5" stroke="#7B1FA2"/><text class="h" x="160" y="338" text-anchor="middle">Codex / Claude</text><text class="b" x="160" y="372" text-anchor="middle">direct MCP consumers</text></g>
  <g><rect class="x" x="360" y="90" width="300" height="150" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="510" y="126" text-anchor="middle">mcp-client/app.py</text><text class="b" x="510" y="159" text-anchor="middle">MCPClientState · lifespan</text><text class="b" x="510" y="190" text-anchor="middle">routing · pagination</text><text class="b" x="510" y="218" text-anchor="middle">export orchestration</text></g>
  <g><rect class="x" x="360" y="300" width="300" height="150" rx="7" fill="#E0F7FA" stroke="#00838F"/><text class="h" x="510" y="336" text-anchor="middle">Client presentation</text><text class="b" x="510" y="369" text-anchor="middle">dashboard.py + renderers</text><text class="b" x="510" y="400" text-anchor="middle">templates · CSS · JavaScript</text></g>
  <g><rect class="x" x="360" y="520" width="300" height="120" rx="7" fill="#FFFDE7" stroke="#F9A825"/><text class="h" x="510" y="556" text-anchor="middle">Client exports</text><text class="b" x="510" y="589" text-anchor="middle">five *_export.py modules</text><text class="b" x="510" y="617" text-anchor="middle">UTF-8 CSV · XLSX tables</text></g>
  <g><rect class="x" x="740" y="110" width="250" height="120" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="865" y="146" text-anchor="middle">HTTP MCP /mcp</text><text class="b" x="865" y="179" text-anchor="middle">JSON text payloads</text><text class="b" x="865" y="207" text-anchor="middle">27 read-only tools</text></g>
  <g><rect class="x" x="1070" y="90" width="330" height="150" rx="7" fill="#FCE4EC" stroke="#C2185B"/><text class="h" x="1235" y="126" text-anchor="middle">server.py + dashboard/__init__.py</text><text class="b" x="1235" y="159" text-anchor="middle">FastAPI · CORS · FastMCP</text><text class="b" x="1235" y="190" text-anchor="middle">middleware · lifespan · routes</text></g>
  <g><rect class="x" x="1070" y="300" width="330" height="130" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="1235" y="336" text-anchor="middle">mcp_tools.py + routes.py</text><text class="b" x="1235" y="369" text-anchor="middle">tools · resources</text><text class="b" x="1235" y="400" text-anchor="middle">health · readiness · refresh</text></g>
  <g><rect class="x" x="740" y="520" width="330" height="150" rx="7" fill="#E8EAF6" stroke="#3949AB"/><text class="h" x="905" y="556" text-anchor="middle">DataCacheService + lifecycle</text><text class="b" x="905" y="589" text-anchor="middle">load · normalize · publish</text><text class="b" x="905" y="620" text-anchor="middle">readiness · history · telemetry</text></g>
  <g><rect class="x" x="1130" y="500" width="270" height="140" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="1265" y="536" text-anchor="middle">Generic services</text><text class="b" x="1265" y="569" text-anchor="middle">discovery · query · analysis</text><text class="b" x="1265" y="600" text-anchor="middle">serialization · observability</text></g>
  <g><rect class="x" x="1130" y="710" width="270" height="160" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="1265" y="746" text-anchor="middle">Semantic services</text><text class="b" x="1265" y="779" text-anchor="middle">Statistics · result series</text><text class="b" x="1265" y="810" text-anchor="middle">Trending · Iterative · Coverage</text><text class="b" x="1265" y="841" text-anchor="middle">Comparison · telemetry</text></g>
  <g><rect class="x" x="740" y="740" width="330" height="150" rx="7" fill="#F5F5F5" stroke="#616161"/><text class="h" x="905" y="776" text-anchor="middle">Data package</text><text class="b" x="905" y="809" text-anchor="middle">S3 + fixture readers</text><text class="b" x="905" y="840" text-anchor="middle">YAML · schemas · fixtures</text></g>
