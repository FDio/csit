<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">CSIT Dashboard client request flow</title><desc id="desc">A browser request passes through the Starlette app and resilient MCP state to dataset-specific workflows, rendering, exports, and failure boundaries.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#455A64"/></marker><style>.t{font:700 26px Arial;fill:#172B4D}.h{font:700 16px Arial;fill:#172B4D}.b{font:15px Arial;fill:#263238}.x{stroke-width:2}.e{fill:none;stroke:#455A64;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1800" height="1000" fill="#fff"/><text class="t" x="40" y="48">CSIT Dashboard Client Request Flow</text>
  <g><rect class="x" x="40" y="90" width="250" height="120" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="165" y="126" text-anchor="middle">Browser</text><text class="b" x="165" y="159" text-anchor="middle">GET /?dataset=...</text><text class="b" x="165" y="190" text-anchor="middle">URL-persisted selections</text></g>
  <g><rect class="x" x="360" y="90" width="280" height="120" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="500" y="126" text-anchor="middle">Starlette app.py</text><text class="b" x="500" y="159" text-anchor="middle">tab · arguments · pagination</text><text class="b" x="500" y="190" text-anchor="middle">redirects · export responses</text></g>
  <g><rect class="x" x="710" y="90" width="290" height="120" rx="7" fill="#F3E5F5" stroke="#7B1FA2"/><text class="h" x="855" y="126" text-anchor="middle">MCPClientState</text><text class="b" x="855" y="159" text-anchor="middle">initial attempt · lazy reconnect</text><text class="b" x="855" y="190" text-anchor="middle">shared lock · last metadata</text></g>
  <g><rect class="x" x="1070" y="90" width="290" height="120" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="1215" y="126" text-anchor="middle">mcp-server /mcp</text><text class="b" x="1215" y="159" text-anchor="middle">datasets() every page</text><text class="b" x="1215" y="190" text-anchor="middle">tab-specific tools</text></g>
  <g><rect class="x" x="1430" y="90" width="250" height="120" rx="7" fill="#F5F5F5" stroke="#616161"/><text class="h" x="1555" y="126" text-anchor="middle">GET /health</text><text class="b" x="1555" y="159" text-anchor="middle">always HTTP 200</text><text class="b" x="1555" y="190" text-anchor="middle">nested MCP state</text></g>
  <g><rect class="x" x="710" y="300" width="290" height="120" rx="7" fill="#E0F7FA" stroke="#00838F"/><text class="h" x="855" y="336" text-anchor="middle">Dataset router</text><text class="b" x="855" y="369" text-anchor="middle">Statistics · Trending · Iterative</text><text class="b" x="855" y="400" text-anchor="middle">Coverage · Comparison</text></g>
  <g><rect class="x" x="30" y="520" width="300" height="150" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="180" y="556" text-anchor="middle">Statistics</text><text class="b" x="180" y="589" text-anchor="middle">job_statistics · bar charts</text><text class="b" x="180" y="620" text-anchor="middle">lazy failed-test details</text></g>
  <g><rect class="x" x="370" y="520" width="300" height="150" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="520" y="556" text-anchor="middle">Trending</text><text class="b" x="520" y="589" text-anchor="middle">catalog + complete series</text><text class="b" x="520" y="620" text-anchor="middle">scatter · JumpAvg · anomalies</text><text class="b" x="520" y="648" text-anchor="middle">canonical add/remove redirects</text></g>
  <g><rect class="x" x="710" y="520" width="300" height="150" rx="7" fill="#FFFDE7" stroke="#F9A825"/><text class="h" x="860" y="556" text-anchor="middle">Iterative</text><text class="b" x="860" y="589" text-anchor="middle">catalog + complete series</text><text class="b" x="860" y="620" text-anchor="middle">Tukey box plots · details</text><text class="b" x="860" y="648" text-anchor="middle">canonical add/remove redirects</text></g>
  <g><rect class="x" x="1050" y="520" width="300" height="150" rx="7" fill="#FCE4EC" stroke="#C2185B"/><text class="h" x="1200" y="556" text-anchor="middle">Coverage</text><text class="b" x="1200" y="589" text-anchor="middle">catalog + complete tables</text><text class="b" x="1200" y="620" text-anchor="middle">accordions · sorting · links</text><text class="b" x="1200" y="648" text-anchor="middle">retain last complete table</text></g>
  <g><rect class="x" x="1390" y="520" width="300" height="150" rx="7" fill="#E8EAF6" stroke="#3949AB"/><text class="h" x="1540" y="556" text-anchor="middle">Comparison</text><text class="b" x="1540" y="589" text-anchor="middle">catalog + summary table</text><text class="b" x="1540" y="620" text-anchor="middle">outliers · filters · sorting</text><text class="b" x="1540" y="648" text-anchor="middle">table and raw-data views</text></g>
  <g><rect class="x" x="360" y="790" width="330" height="150" rx="7" fill="#E0F7FA" stroke="#00838F"/><text class="h" x="525" y="826" text-anchor="middle">Server-rendered output</text><text class="b" x="525" y="859" text-anchor="middle">templates · external CSS/JS</text><text class="b" x="525" y="890" text-anchor="middle">SVG · dialogs · inline errors</text></g>
  <g><rect class="x" x="770" y="790" width="330" height="150" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="935" y="826" text-anchor="middle">Lazy actions</text><text class="b" x="935" y="859" text-anchor="middle">five exports · CSV/XLSX</text><text class="b" x="935" y="890" text-anchor="middle">Show URL · clipboard fallback</text></g>
  <g><rect class="x" x="1180" y="790" width="330" height="150" rx="7" fill="#FFEBEE" stroke="#C62828"/><text class="h" x="1345" y="826" text-anchor="middle">Failure boundary</text><text class="b" x="1345" y="859" text-anchor="middle">MCP JSON: inline · exception: 503</text><text class="b" x="1345" y="890" text-anchor="middle">malformed export response: 502</text></g>
  <path class="e" d="M290 150H360"/><path class="e" d="M640 150H710"/><path class="e" d="M1000 150H1070"/><path class="e" d="M900 90V70H1555V90"/><path class="e" d="M500 210V260H855V300"/>
  <path class="e" d="M855 420V470H180V520"/><path class="e" d="M855 420V470H520V520"/><path class="e" d="M855 420V520"/><path class="e" d="M855 470H1200V520"/><path class="e" d="M855 470H1540V520"/>
