<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">CSIT MCP data lifecycle</title><desc id="desc">The lifespan validates settings, reads and normalizes data, publishes required data, indexes telemetry, finalizes status, serves semantic services, and preserves the prior cache on later failures.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#455A64"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#C62828"/></marker><style>.t{font:700 26px Arial;fill:#172B4D}.h{font:700 16px Arial;fill:#172B4D}.b{font:15px Arial;fill:#263238}.x{stroke-width:2}.e{fill:none;stroke:#455A64;stroke-width:2.5;marker-end:url(#a)}.f{fill:none;stroke:#C62828;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#r)}</style></defs>
  <rect width="1500" height="1000" fill="#fff"/><text class="t" x="40" y="48">CSIT MCP Data Lifecycle</text>
  <g><rect class="x" x="40" y="100" width="250" height="120" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="165" y="135" text-anchor="middle">FastMCP lifespan</text><text class="b" x="165" y="168" text-anchor="middle">restore local snapshot</text><text class="b" x="165" y="196" text-anchor="middle">refresh · scheduler</text></g>
  <g><rect class="x" x="360" y="100" width="250" height="120" rx="7" fill="#F3E5F5" stroke="#7B1FA2"/><text class="h" x="485" y="135" text-anchor="middle">Validate settings</text><text class="b" x="485" y="168" text-anchor="middle">invalid config fails load</text><text class="b" x="485" y="196" text-anchor="middle">process stays live</text></g>
  <g><rect class="x" x="680" y="100" width="290" height="120" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="825" y="135" text-anchor="middle">Read source</text><text class="b" x="825" y="168" text-anchor="middle">required then optional</text><text class="b" x="825" y="196" text-anchor="middle">S3 retries or fixtures</text></g>
  <g><rect class="x" x="1040" y="90" width="300" height="140" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="1190" y="126" text-anchor="middle">Normalize copies</text><text class="b" x="1190" y="159" text-anchor="middle">UTC time · typed build/passed</text><text class="b" x="1190" y="190" text-anchor="middle">numeric results · host lists</text></g>
  <g><rect class="x" x="1040" y="310" width="300" height="120" rx="7" fill="#FFFDE7" stroke="#F9A825"/><text class="h" x="1190" y="346" text-anchor="middle">Check required data</text><text class="b" x="1190" y="379" text-anchor="middle">Statistics + Trending</text><text class="b" x="1190" y="407" text-anchor="middle">initial absence = failed</text></g>
  <g><rect class="x" x="680" y="310" width="290" height="120" rx="7" fill="#E8EAF6" stroke="#3949AB"/><text class="h" x="825" y="346" text-anchor="middle">Publish result cache</text><text class="b" x="825" y="379" text-anchor="middle">ready or degraded</text><text class="b" x="825" y="407" text-anchor="middle">readiness can serve now</text></g>
  <g><rect class="x" x="360" y="300" width="250" height="140" rx="7" fill="#E0F7FA" stroke="#00838F"/><text class="h" x="485" y="336" text-anchor="middle">Telemetry paths</text><text class="b" x="485" y="369" text-anchor="middle">private sidecar · locator</text><text class="b" x="485" y="400" text-anchor="middle">isolated worker · budgets</text></g>
  <g><rect class="x" x="40" y="300" width="250" height="140" rx="7" fill="#FCE4EC" stroke="#C2185B"/><text class="h" x="165" y="336" text-anchor="middle">Persist generation</text><text class="b" x="165" y="369" text-anchor="middle">Arrow v2 · checksums</text><text class="b" x="165" y="400" text-anchor="middle">previous generation fallback</text></g>
  <g><rect class="x" x="40" y="560" width="280" height="120" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="180" y="596" text-anchor="middle">Serving cache</text><text class="b" x="180" y="629" text-anchor="middle">results + private sidecars</text><text class="b" x="180" y="657" text-anchor="middle">no access-time mutation</text></g>
  <g><rect class="x" x="390" y="550" width="290" height="140" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="535" y="586" text-anchor="middle">Derived semantics</text><text class="b" x="535" y="619" text-anchor="middle">result series · Statistics join</text><text class="b" x="535" y="650" text-anchor="middle">JumpAvg · HDRH · Comparison</text></g>
  <g><rect class="x" x="750" y="550" width="290" height="140" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="895" y="586" text-anchor="middle">MCP boundary</text><text class="b" x="895" y="619" text-anchor="middle">discovery · query · analysis</text><text class="b" x="895" y="650" text-anchor="middle">pagination · byte guard</text></g>
  <g><rect class="x" x="1110" y="550" width="270" height="140" rx="7" fill="#F5F5F5" stroke="#616161"/><text class="h" x="1245" y="586" text-anchor="middle">Status consumers</text><text class="b" x="1245" y="619" text-anchor="middle">ready · refresh · server info</text><text class="b" x="1245" y="650" text-anchor="middle">discovery · cache errors</text></g>
  <g><rect class="x" x="390" y="790" width="290" height="140" rx="7" fill="#FFEBEE" stroke="#C62828"/><text class="h" x="535" y="826" text-anchor="middle">Failure policy</text><text class="b" x="535" y="859" text-anchor="middle">first failure: failed</text><text class="b" x="535" y="890" text-anchor="middle">later: keep cache, degraded</text></g>
  <g><rect class="x" x="750" y="790" width="290" height="130" rx="7" fill="#FAFAFA" stroke="#455A64"/><text class="h" x="895" y="826" text-anchor="middle">JSON events</text><text class="b" x="895" y="859" text-anchor="middle">refresh · telemetry · tools</text><text class="b" x="895" y="890" text-anchor="middle">resources · size guard</text></g>
  <path class="e" d="M290 160H360"/><path class="e" d="M610 160H680"/><path class="e" d="M970 160H1040"/><path class="e" d="M1190 230V310"/><path class="e" d="M1040 370H970"/><path class="e" d="M680 370H610"/><path class="e" d="M360 370H290"/><path class="e" d="M165 440V560"/><path class="e" d="M320 620H390"/><path class="e" d="M680 620H750"/><path class="e" d="M1040 620H1110"/>
  <path class="f" d="M360 160H330V740H535V790"/><path class="f" d="M1340 370H1410V740H650V790"/><path d="M895 690V790" fill="none" stroke="#455A64" stroke-width="2" stroke-dasharray="8 6"/>
</svg>
