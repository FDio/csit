<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">CSIT MCP data lifecycle and serving flow</title>
  <desc id="desc">Refresh triggers load S3 or fixture data, normalize and publish a cache, build telemetry and semantic views, guard serialized responses, and serve MCP and dashboard consumers.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#455A64"/></marker><style>.t{font:700 26px Arial;fill:#172B4D}.h{font:700 16px Arial;fill:#172B4D}.b{font:15px Arial;fill:#263238}.box{stroke-width:2}.edge{fill:none;stroke:#455A64;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="950" fill="#fff"/><text class="t" x="40" y="48">CSIT MCP Data Lifecycle and Serving Flow</text>
  <g><rect class="box" x="40" y="100" width="210" height="120" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="145" y="135" text-anchor="middle">Refresh triggers</text><text class="b" x="145" y="168" text-anchor="middle">startup · manual</text><text class="b" x="145" y="196" text-anchor="middle">optional schedule</text></g>
  <g><rect class="box" x="40" y="290" width="210" height="120" rx="7" fill="#F3E5F5" stroke="#7B1FA2"/><text class="h" x="145" y="325" text-anchor="middle">Validated settings</text><text class="b" x="145" y="358" text-anchor="middle">mode · window · limits</text><text class="b" x="145" y="386" text-anchor="middle">CORS · feature flags</text></g>
  <g><rect class="box" x="330" y="100" width="250" height="130" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="455" y="137" text-anchor="middle">Reader</text><text class="b" x="455" y="171" text-anchor="middle">required then optional</text><text class="b" x="455" y="202" text-anchor="middle">S3 retries or fixture JSON</text></g>
  <g><rect class="box" x="330" y="300" width="250" height="120" rx="7" fill="#FFFDE7" stroke="#F9A825"/><text class="h" x="455" y="335" text-anchor="middle">Source metadata</text><text class="b" x="455" y="368" text-anchor="middle">data.yaml · Arrow schemas</text><text class="b" x="455" y="396" text-anchor="middle">result_metadata.yaml</text></g>
  <g><rect class="box" x="660" y="100" width="290" height="140" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="805" y="137" text-anchor="middle">Cache-boundary normalization</text><text class="b" x="805" y="171" text-anchor="middle">UTC time · typed build/passed</text><text class="b" x="805" y="202" text-anchor="middle">numeric result_* · list hosts</text></g>
  <g><rect class="box" x="660" y="310" width="290" height="140" rx="7" fill="#E0F7FA" stroke="#00838F"/><text class="h" x="805" y="347" text-anchor="middle">OpenMetrics paths</text><text class="b" x="805" y="380" text-anchor="middle">private sidecar · row locator</text><text class="b" x="805" y="411" text-anchor="middle">worker · budgets · cache</text></g>
  <g><rect class="box" x="1040" y="100" width="300" height="150" rx="7" fill="#E8EAF6" stroke="#3949AB"/><text class="h" x="1190" y="137" text-anchor="middle">Published cache</text><text class="b" x="1190" y="171" text-anchor="middle">result frames without blobs</text><text class="b" x="1190" y="202" text-anchor="middle">Arrow v2 snapshot + checksums</text><text class="b" x="1190" y="229" text-anchor="middle">previous generation retained</text></g>
  <g><rect class="box" x="1040" y="310" width="300" height="150" rx="7" fill="#F5F5F5" stroke="#616161"/><text class="h" x="1190" y="347" text-anchor="middle">Status metadata</text><text class="b" x="1190" y="380" text-anchor="middle">readiness · freshness · age</text><text class="b" x="1190" y="411" text-anchor="middle">datasets · telemetry · config</text><text class="b" x="1190" y="438" text-anchor="middle">10 refresh-history entries</text></g>
  <g><rect class="box" x="660" y="540" width="330" height="150" rx="7" fill="#FCE4EC" stroke="#C2185B"/><text class="h" x="825" y="577" text-anchor="middle">Semantic services</text><text class="b" x="825" y="610" text-anchor="middle">Statistics · Trending + JumpAvg</text><text class="b" x="825" y="641" text-anchor="middle">Iterative · Coverage + HDRH</text><text class="b" x="825" y="668" text-anchor="middle">Comparison · result metadata</text></g>
  <g><rect class="box" x="1050" y="540" width="290" height="130" rx="7" fill="#E3F2FD" stroke="#1976D2"/><text class="h" x="1195" y="577" text-anchor="middle">Generic services</text><text class="b" x="1195" y="610" text-anchor="middle">discovery · query · analysis</text><text class="b" x="1195" y="641" text-anchor="middle">filter · aggregate · paginate</text></g>
  <g><rect class="box" x="1050" y="740" width="290" height="140" rx="7" fill="#FFF3E0" stroke="#EF6C00"/><text class="h" x="1195" y="777" text-anchor="middle">Serialization boundary</text><text class="b" x="1195" y="810" text-anchor="middle">JSON-safe · 1 MB guard</text><text class="b" x="1195" y="841" text-anchor="middle">1,000-record private previews</text></g>
  <g><rect class="box" x="1410" y="690" width="170" height="190" rx="7" fill="#E8F5E9" stroke="#2E7D32"/><text class="h" x="1495" y="727" text-anchor="middle">Consumers</text><text class="b" x="1495" y="764" text-anchor="middle">Codex / Claude</text><text class="b" x="1495" y="797" text-anchor="middle">five-tab dashboard</text><text class="b" x="1495" y="830" text-anchor="middle">Prefab app</text></g>
  <g><rect class="box" x="330" y="730" width="250" height="140" rx="7" fill="#FAFAFA" stroke="#455A64"/><text class="h" x="455" y="767" text-anchor="middle">Structured logs</text><text class="b" x="455" y="800" text-anchor="middle">refresh · telemetry</text><text class="b" x="455" y="831" text-anchor="middle">tools · resources · size guard</text></g>
