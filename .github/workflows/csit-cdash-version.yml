---
name: csit-cdash-version

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on:
      - self-hosted
      - nomad
      - fdio:arch=x86_64
      - fdio:class=builder
      - fdio:size=csit
      - fdio:namespace=prod
      - fdio:os=ubuntu2404
      - fdio:workflow=${{ github.run_id }}

    env:
      JOB_NAME: ${{ github.workflow }}-${{ github.job }}
      BUILD_ID: ${{ github.run_number }}

    steps:
      - name: GitHub Checkout CSIT
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v6.0.2
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Environment
        # yamllint disable-line rule:line-length
        uses: fdio/.github/.github/actions/setup-executor-env@4eb74b59c8f76192681941b89e277454d96bebb8

      - name: Set up Terraform
        # yamllint disable-line rule:line-length
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Run CSIT Bootstrap
        # yamllint disable-line rule:line-length
        uses: fdio/csit/.github/actions/csit-bootstrap@cee2088675d00de5f4a47f386a6c05315bfc170c
        with:
          bootstrap_script: bootstrap_aws_eb_version_${{ github.job }}.sh
          with_oper: false

  deploy:
    needs: verify
    runs-on:
      - self-hosted
      - nomad
      - fdio:arch=x86_64
      - fdio:class=builder
      - fdio:size=csit
      - fdio:namespace=prod
      - fdio:os=ubuntu2404
      - fdio:workflow=${{ github.run_id }}

    env:
      JOB_NAME: ${{ github.workflow }}-${{ github.job }}
      BUILD_ID: ${{ github.run_number }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:
      - name: GitHub Checkout CSIT
        # yamllint disable-line rule:line-length
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v6.0.2
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Environment
        # yamllint disable-line rule:line-length
        uses: fdio/.github/.github/actions/setup-executor-env@4eb74b59c8f76192681941b89e277454d96bebb8

      - name: Set up Terraform
        # yamllint disable-line rule:line-length
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Run CSIT Bootstrap
        # yamllint disable-line rule:line-length
        uses: fdio/csit/.github/actions/csit-bootstrap@cee2088675d00de5f4a47f386a6c05315bfc170c
        with:
          bootstrap_script: bootstrap_aws_eb_version_${{ github.job }}.sh
          with_oper: false
