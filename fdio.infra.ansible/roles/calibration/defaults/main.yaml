---
# file: defaults/main.yaml

# Kernel version to check.
kernel_version: "{{ kernel_version_by_distro_by_arch[ansible_facts['distribution'] | lower][ansible_facts['distribution_release']][ansible_facts['machine']] }}"

kernel_version_by_distro_by_arch:
  ubuntu:
    jammy:
      x86_64:
        - "5.15.0-46-generic"
    noble:
      x86_64:
        - "6.8.0-45-generic"
        - "6.8.0-100-generic"
        - "6.8.0-1016-aws"
        - "5.15.0-1000-aws"
        - "5.4.0-1009-aws"
      aarch64:
        - "6.8.0-45-generic"
