---
# file: tasks/sut.yaml

- name: Template Compose File
  ansible.builtin.template:
    src: docker-compose-sut.yaml.j2
    dest: /opt/csit-docker-images/docker-compose-sut.yaml
    owner: root
    group: root
    mode: 0755
  tags:
    - docker-sut

- name: Start csit-initialize-docker-sut.service
  ansible.builtin.copy:
    src: files/csit-initialize-docker-sut.service
    dest: /etc/systemd/system/
    owner: root
    group: root
    mode: 0644
  notify:
    - Start csit-initialize-docker-sut.service
  tags:
    - docker-sut

- name: Pull csit-executor-sut-inner-prod
  community.docker.docker_image_pull:
    name: ghcr.io/fdio/csit-executor-sut-inner-prod:latest
  tags:
    - docker-sut

- meta: flush_handlers