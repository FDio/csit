---
# file: tasks/tg.yaml

- name: Template Compose File
  ansible.builtin.template:
    src: docker-compose-tg.yaml
    dest: /opt/csit-docker-images/docker-compose-tg.yaml
    owner: root
    group: root
    mode: 0755
  tags:
    - docker-tg

- name: Start csit-initialize-docker-tg.service
  ansible.builtin.copy:
    src: files/csit-initialize-docker-tg.service
    dest: /etc/systemd/system/
    owner: root
    group: root
    mode: 0644
  notify:
    - Start csit-initialize-docker-tg.service
  tags:
    - docker-tg

- meta: flush_handlers